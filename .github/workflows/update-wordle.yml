name: Update Wordle Answers

on:
  schedule:
    # Run at 7:00 AM UTC daily (3:00 AM ET) — yesterday's answer is always visible by then
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Also allow manual trigger from GitHub Actions UI
    inputs:
      puzzle_num:
        description: 'Puzzle number to add (leave blank to auto-scrape)'
        required: false
      puzzle_word:
        description: 'Answer word (required if puzzle_num is set)'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests firebase-admin

      - name: Scrape and update Wordle answers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUZZLE_NUM: ${{ github.event.inputs.puzzle_num }}
          PUZZLE_WORD: ${{ github.event.inputs.puzzle_word }}
        run: python .github/scripts/update_wordle.py
